services:
  local-agent-ui:
    build:
      context: ..
      dockerfile: .devops/Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-python:3.12-slim}
    container_name: ${CONTAINER_NAME:-local-agent-ui}
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${UI_PORT:-8000}:8000"
    environment:
      LLM_API_URL: "${LLM_API_URL:-http://host.docker.internal:8080/v1}"
      VAULT_ROOT: /app/vault
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - type: bind
        source: ../vault
        target: /app/vault
      # The sessions database is project-owned state (only the app touches it),
      # so it lives in the per-machine local/ tree, not the model-facing vault.
      - type: bind
        source: ../local/sessions
        target: /app/local/sessions
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Entry point: the app lives in src/app.py, exposed as `app` on the `src.app` module.
    command: ["python", "-m", "uvicorn", "src.app:app", "--host", "0.0.0.0", "--port", "8000"]
