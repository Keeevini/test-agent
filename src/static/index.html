<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Local Agent</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' width='32' height='32'%3E%3Crect x='2' y='2' width='20' height='20' rx='6' fill='none' stroke='%23fab283' stroke-width='2'/%3E%3Ccircle cx='8' cy='12' r='2' fill='%23fab283'/%3E%3Ccircle cx='14' cy='12' r='2' fill='%23fab283'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <h1>Local Agent</h1>
        <p>Private llama.cpp assistant · sandboxed workspace</p>
      </div>
      <div class="topbar-actions">
        <button id="sidebarToggle" class="ghost-button sidebar-toggle" aria-label="Toggle session list" aria-expanded="false">☰</button>
        <div class="context-indicator" id="contextIndicator" title="Context usage">
          <span class="context-label">Context</span>
          <div class="context-bar">
            <div class="context-fill" id="contextFill"></div>
          </div>
          <span class="context-pct" id="contextPct">0%</span>
        </div>
        <span id="connectionBadge" class="badge">Checking…</span>
        <button id="clearButton" class="ghost-button">New chat</button>
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <input type="search" id="sessionSearch" class="session-search" placeholder="Search sessions…" aria-label="Search sessions" autocomplete="off" />
        </div>
        <div id="sessionList" class="session-list" role="listbox" aria-label="Sessions">
          <div class="session-list-empty" id="sessionListEmpty">No sessions yet.</div>
        </div>
      </aside>
      <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
      <section class="chat-panel">
        <div id="messages" class="messages" aria-live="polite">
          <div class="empty-state" id="emptyState">
            <div class="empty-icon" aria-hidden="true">
              <svg width="56" height="56" viewBox="0 0 48 48" fill="none" stroke="var(--accent)" stroke-width="2">
                <rect x="6" y="6" width="36" height="36" rx="8" />
                <circle cx="18" cy="24" r="3" fill="var(--accent)" stroke="none" />
                <circle cx="30" cy="24" r="3" fill="var(--accent)" stroke="none" />
                <path d="M18 32 Q24 36 30 32" stroke-linecap="round" />
              </svg>
            </div>
            <h2>Your local assistant</h2>
            <p>Ask questions, inspect your knowledge base, or request file changes.
               Read operations run automatically; writes require approval.</p>
            <div class="examples">
              <button class="example">What files are in my workspace?</button>
              <button class="example">Summarize the Markdown notes in this knowledge base.</button>
              <button class="example">Create notes/today.md with a short project log.</button>
            </div>
          </div>
        </div>
        <button id="scrollToBottom" class="scroll-to-bottom" aria-label="Scroll to bottom" hidden>↓</button>

        <form id="composer" class="composer">
          <textarea id="prompt" rows="1" placeholder="Message your local agent…" autocomplete="off"></textarea>
          <button id="sendButton" type="submit" aria-label="Send message">
            <span class="send-icon" aria-hidden="true">↑</span>
            <span class="send-label">Send</span>
          </button>
        </form>
      </section>

    </main>
  </div>

  <template id="messageTemplate">
    <article class="message">
      <div class="message-label"></div>
      <div class="message-body"></div>
    </article>
  </template>

  <script src="/static/app.js"></script>
</body>
</html>
